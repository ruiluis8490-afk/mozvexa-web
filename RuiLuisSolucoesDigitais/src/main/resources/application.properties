spring.application.name=RuiLuisSolucoesDigitais

# =========================================================
# PORTA (Configurada para funcionar no Render)
# =========================================================
server.port=${PORT:8080}

# =========================================================
# BASE DE DADOS (Lê as variáveis do Render ou usa o local)
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ruiluis_solucoes_digitais?useSSL=false&serverTimezone=Africa/Maputo&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Rui@123456}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# THYMELEAF
# =========================================================
spring.thymeleaf.cache=false

# =========================================================
# ADMINISTRADOR INICIAL
# =========================================================
app.admin.username=ruiluis
app.admin.password=meireles6